<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CST 433 Hub - Chats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">

  <div class="wa-container multi-chat-layout">
    <!-- Left Sidebar: Chat List -->
    <aside class="wa-sidebar" id="sidebarPanel">
      <div class="wa-sidebar-header">
        <div class="user-profile-badge">
          <div class="wa-avatar" id="myAvatar">U</div>
          <span class="sidebar-title">Discussions</span>
        </div>
        <div class="sidebar-actions">
          <button id="newRoomBtn" title="Create or Join New Room" class="icon-btn">+</button>
          <a href="index.html" class="icon-btn exit-link" title="Exit to Syllabus">←</a>
        </div>
      </div>

      <!-- Search bar -->
      <div class="wa-search-bar">
        <input type="text" id="searchRoomsInput" placeholder="Search or filter rooms...">
      </div>

      <!-- Chat Rooms List -->
      <div class="wa-rooms-list" id="roomsList">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- Right Side: Active Chat Viewport -->
    <section class="wa-main-chat" id="chatPanel">
      <!-- Chat Header -->
      <header class="wa-header">
        <button id="mobileBackBtn" class="mobile-back-btn" title="Back to rooms">←</button>
        <div class="wa-avatar" id="activeRoomAvatar">#</div>
        <div class="wa-chat-info">
          <h3 id="activeRoomTitle">Select a Chat</h3>
          <p id="activeRoomMeta">online</p>
        </div>
      </header>

      <!-- Message Area -->
      <main class="wa-chat-area" id="chatArea">
        <div class="empty-chat-notice">Select a discussion room on the left to start messaging.</div>
      </main>

      <!-- Input Footer -->
      <footer class="wa-footer">
        <input type="text" id="usernameInput" class="wa-name-input" placeholder="Your name" style="width: 130px;">
        <input type="text" id="messageInput" class="wa-msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" class="wa-send-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </footer>
    </section>
  </div>

  <script type="module" src="chat.js"></script>
</body>
</html>
